---
# Ansible collections used by the roles and shared tasks in this repository.
# Install with: ansible-galaxy collection install -r requirements.yml
#
# No versions are pinned here — this file was generated by auditing which
# collection namespaces are actually referenced (via FQCN) in roles/ and
# shared/. Confirm the versions currently working in production (e.g. via
# `ansible-galaxy collection list` on a host that has run this repo
# successfully) and pin them here before relying on this file for a fresh
# environment setup, since an unpinned install always pulls the latest
# release and could introduce breaking changes the roles weren't written
# against.
collections:
  - name: amazon.aws
  - name: ansible.posix
  - name: azure.azcollection
  - name: community.crypto
  - name: community.docker
  - name: community.general
  - name: community.grafana
  - name: community.mongodb
  - name: community.mysql
  - name: hetzner.hcloud
  - name: kubernetes.core

---
- name: Update grub
  ansible.builtin.command: update-grub2
  changed_when: true
  tags: [common, sys]

- name: Restart network service
  ansible.builtin.service:
    name: networking
    state: restarted

- name: Restart network ubuntu service
  ansible.builtin.command: netplan apply
  changed_when: true

- name: Restart SSHD
  ansible.builtin.service:
    name: sshd
    enabled: true
    state: reloaded
  tags: [mgmt, ssh]

# Main Traefik Setup
---
- name: Add traefik user
  ansible.builtin.user:
    name: traefik
    comment: User for traefik server
    group: adm
    shell: /usr/sbin/nologin
    create_home: false
    system: true
    state: present
  tags: [ingress, traefik]

- name: Check if traefik is setup
  ansible.builtin.command: "which traefik"
  register: traefik_check_result
  changed_when: false
  failed_when: false
  tags: [ingress, traefik]

- name: Download and unzip traefik
  when: not traefik_check_result.stdout or traefik_force_reinstall
  ansible.builtin.unarchive:
    src: '{{ lookup("url", "https://api.github.com/repos/traefik/traefik/releases/latest") | from_json | json_query(__traefik_version_query) | select("search", "linux_amd64")
      | list | first }}'
    dest: /tmp
    remote_src: true
  vars:
    __traefik_version_query: assets[?contains(name, 'linux')].browser_download_url
  tags: [ingress, traefik]

- name: Give insecure permissions to an existing file
  when: not traefik_check_result.stdout or traefik_force_reinstall
  ansible.builtin.file:
    path: /tmp/traefik
    owner: traefik
    group: adm
    mode: "0750"

- name: Install traefik
  when: not traefik_check_result.stdout or traefik_force_reinstall
  ansible.builtin.shell: |
    mv /tmp/traefik /usr/local/bin/traefik
  changed_when: true
  notify: Restart traefik
  tags: [ingress, traefik]

- name: Test traefik
  ansible.builtin.command: "traefik version"
  changed_when: false
  tags: [ingress, traefik]

- name: Copy traefik service config
  ansible.builtin.template:
    src: traefik.service.j2
    dest: /etc/systemd/system/traefik.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart traefik
  tags: [ingress, traefik]

- name: Ensue config folder exists
  ansible.builtin.file:
    path: /srv/traefik
    state: directory
    mode: "0755"
  tags: [ingress, traefik]

- name: Ensue log folder exists
  ansible.builtin.file:
    path: /var/log/traefik
    recurse: true
    state: directory
    owner: traefik
    group: adm
    mode: "0644"
  tags: [ingress, traefik]

- name: Copy Traefik default config
  ansible.builtin.copy:
    src: traefik
    dest: /srv/traefik
    owner: traefik
    group: adm
    mode: "0666"
  notify: Restart traefik
  tags: [ingress, traefik]
